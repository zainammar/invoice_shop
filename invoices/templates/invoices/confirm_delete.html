{% extends 'invoices/base.html' %}
{% block title %}Delete Invoice — Invoice Shop{% endblock %}
{% block content %}
<div class="card confirm">
  <div class="ico"><svg class="i"><use href="#i-trash"/></svg></div>
  <h1 class="card-title" style="justify-content:center;margin-bottom:8px">Delete this invoice?</h1>
  <p class="muted">You are about to permanently delete:</p>
  <div class="target">
    <strong>{{ invoice.invoice_number }}</strong>
    <span>{{ invoice.customer_name }}</span>
  </div>
  <p class="muted">This cannot be undone.</p>
  <div class="actions">
    <a href="{% url 'invoice_detail' invoice.pk %}" class="btn btn-outline"><svg class="i"><use href="#i-back"/></svg>Cancel</a>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger"><svg class="i"><use href="#i-trash"/></svg>Yes, delete</button>
    </form>
  </div>
</div>
{% endblock %}
