{% extends 'invoices/base.html' %}
{% block title %}Delete Invoice{% endblock %}
{% block content %}
<div style="max-width:500px;margin:4rem auto;">
  <div class="card" style="text-align:center;padding:2.5rem;">
    <div style="font-size:4rem;margin-bottom:1rem;">🗑️</div>
    <h2 style="color:#1a1a2e;margin-bottom:0.5rem;">Delete Invoice?</h2>
    <p style="color:#64748b;margin-bottom:0.5rem;">You are about to permanently delete:</p>
    <div style="background:#fee2e2;border-radius:8px;padding:1rem;margin:1rem 0;">
      <strong style="color:#dc2626;font-size:1.1rem;">{{ invoice.invoice_number }}</strong><br>
      <span style="color:#991b1b;font-size:0.9rem;">{{ invoice.customer_name }}</span>
    </div>
    <p style="color:#94a3b8;font-size:0.85rem;margin-bottom:1.5rem;">This action cannot be undone.</p>
    <div style="display:flex;gap:1rem;justify-content:center;">
      <a href="{% url 'invoice_detail' invoice.pk %}" class="btn btn-outline">← Cancel</a>
      <form method="post" style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">🗑 Yes, Delete</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
