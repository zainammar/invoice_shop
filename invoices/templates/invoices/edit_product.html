{% extends 'invoices/base.html' %}
{% block title %}Edit Product{% endblock %}
{% block content %}
<div style="max-width:480px;margin:3rem auto;">
  <div class="card">
    <h2 style="font-size:1.2rem;font-weight:700;margin-bottom:1.5rem;color:#1a1a2e;">✏️ Edit Product</h2>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label>Product Name *</label>
        <input type="text" name="product_name" class="form-control" value="{{ product.product_name }}" required>
      </div>
      <div class="form-group">
        <label>Unit Price (Rs.) *</label>
        <input type="number" name="unit_price" class="form-control" value="{{ product.unit_price }}" min="0" step="0.01" required>
      </div>
      <div style="display:flex;gap:1rem;margin-top:1rem;">
        <a href="{% url 'products' %}" class="btn btn-outline">Cancel</a>
        <button type="submit" class="btn btn-primary">💾 Update Product</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
