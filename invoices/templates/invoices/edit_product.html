{% extends 'invoices/base.html' %}
{% block title %}Edit Product — Invoice Shop{% endblock %}
{% block main_class %}shell--narrow{% endblock %}
{% block content %}
<header class="page-head">
  <h1 class="page-title">Edit product</h1>
</header>
<div class="card">
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label for="product_name">Product name</label>
      <input id="product_name" type="text" name="product_name" class="form-control" value="{{ product.product_name }}" required>
    </div>
    <div class="form-group">
      <label for="unit_price">Unit price (Rs.)</label>
      <input id="unit_price" type="number" name="unit_price" class="form-control" value="{{ product.unit_price }}" min="0" step="0.01" required>
    </div>
    <div class="form-actions">
      <a href="{% url 'products' %}" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-primary">Update product</button>
    </div>
  </form>
</div>
{% endblock %}
